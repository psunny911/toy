name: Deploy web/, tracker/, vlog/, reading/, counters/ and knit/ to GitHub Pages

on:
  push:
    branches:
      - claude/android-language-learning-tracker-s3e7rz
    paths:
      - "web/**"
      - "tracker/**"
      - "vlog/**"
      - "reading/**"
      - "counters/**"
      - "knit/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test tracker logic
        working-directory: tracker
        run: node --test

      - name: Test vlog logic
        working-directory: vlog
        run: node --test

      - name: Test reading logic
        working-directory: reading
        run: node --test

      - name: Test counters logic
        working-directory: counters
        run: node --test

      - name: Test knit logic
        working-directory: knit
        run: node --test

      # 사이트 루트 = web/ (사진 콜라주), /tracker/ = 데일리 트래커, /vlog/ = 5초 브이로그, /reading/ = 영어 읽기, /counters/ = 카운터, /knit/ = 배색뜨개
      - name: Assemble site
        run: |
          mkdir -p _site/tracker _site/vlog _site/reading _site/counters _site/knit
          cp -r web/. _site/
          cp -r tracker/index.html tracker/manifest.webmanifest tracker/sw.js tracker/css tracker/js tracker/icons _site/tracker/
          cp -r vlog/index.html vlog/css vlog/js vlog/icons _site/vlog/
          cp -r reading/index.html reading/css reading/js reading/icons reading/sample _site/reading/
          cp -r counters/index.html counters/css counters/js counters/icons _site/counters/
          cp -r knit/index.html knit/css knit/js knit/icons _site/knit/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
